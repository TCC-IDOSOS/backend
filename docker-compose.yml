services:
  app:
    build: .
    container_name: fisioaging-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fisioaging
      SPRING_DATASOURCE_USERNAME: fisioaging
      SPRING_DATASOURCE_PASSWORD: fisioaging
      AWS_S3_BUCKET: fisioaging-tests
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: fisioaging-postgres
    environment:
      POSTGRES_DB: fisioaging
      POSTGRES_USER: fisioaging
      POSTGRES_PASSWORD: fisioaging
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisioaging"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
